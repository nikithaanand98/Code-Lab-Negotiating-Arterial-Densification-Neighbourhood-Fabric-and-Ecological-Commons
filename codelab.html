<html lang="en">

<script>try{var t=localStorage.getItem("codelab.theme");t="light";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}</script>  
<link rel="preconnect" href="https://fonts.googleapis.com">  
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">  
<style>  
:root{
 /* ---------- Urban Challenges Studio · exhibition panel palette (UTC2023 Final Synthesis) ----------
    Swatches only: primary blues + greys ~75-80%, secondary yellow + olive 15-20%, coral highlight 5%.
    No black anywhere. Light grey (C7 M5 Y5 K0, approximated in RGB) is for tiles and backgrounds.
    Tints (a swatch mixed with white or light grey) are used only for soft backgrounds, lines and 3D shading. */
 --b1:#174F7B; --b2:#427CBF; --b3:#6A9ED4; --b4:#9CBEE4; --g1:#656565; --g2:#858484; --g3:#A4A3A3; --yel:#F8BF4C; --oli:#9FA980; --cor:#ED694D; --lg:#ECF0F1;
 --accent:#174F7B; --accent-strong:#174F7B; --accent-soft:rgba(156,190,228,.38); --accent-ink:#ffffff; --accent-glow:rgba(23,79,123,.28);
 --indigo:#427CBF;
 --bg:#ECF0F1; --surface:#ffffff; --raised:#ffffff; --sunk:#ECF0F1; --hover:#DAE5EE; --line:#DBDADA; --line-2:#C1C0C0;
 --fg:#174F7B; --muted:#656565; --faint:#858484; --inv:#174F7B; --inv-fg:#ffffff;
 --pass:#9FA980; --pass-soft:rgba(159,169,128,.30); --pass-ink:#427CBF;
 --warn:#F8BF4C; --warn-soft:rgba(248,191,76,.32); --warn-ink:#656565;
 --fail:#ED694D; --fail-soft:rgba(237,105,77,.18); --fail-ink:#ED694D;
 --shadow-1:0 1px 2px rgba(23,79,123,.08),0 1px 1px rgba(23,79,123,.05);
 --shadow-2:0 6px 18px rgba(23,79,123,.10),0 2px 6px rgba(23,79,123,.06);
 --shadow-3:0 24px 64px rgba(23,79,123,.28),0 8px 24px rgba(23,79,123,.18);
 --backdrop:rgba(23,79,123,.42);
 /* ---------- map: light grey ground, white roads, grey context, olive nature, blue water ---------- */
 --ground:#ECF0F1; --ctx:#D6D9DA; --ctx-line:#C7C8C8; --road:#ffffff; --road-jv:#E0E4E5; --ped:#FDEDCD;
 --mangrove:#BEC5AD; --mangrove-2:#CFD5C6; --water:#9CBEE4; --open:#D7DBCA; --rg:#B4BC9C; --terrace:#C7CDB5;
 --paving:#E2E5E6; --lane:#FBDA97; --board:#174F7B; --tree:#9FA980; --mass:#ffffff; --mass-line:#C7C8C8; --shade:rgba(23,79,123,.14);
 --eco:#9FA980; --int:#F8BF4C; --jv:#427CBF; --row1:#C0C6AB; --zone:#174F7B;
 --h0:#427CBF; --h1:#9CBEE4; --h2:#FCDFA6; --h3:#F8BF4C; --h4:#ED694D; --exp:#427CBF; --imp:#ED694D;
 --cfin:#427CBF; --cfout:#F8BF4C;
 --bld:#427CBF; --retro:#858484; --edge-w:#ffffff; --ctx-bld:#BFC0C1;
 --u-ret:#ED694D; --u-off:#174F7B; --u-park:#A4A3A3; --u-home:#6A9ED4; --u-reh:#9CBEE4; --u-rent:#F8BF4C; --u-com:#9FA980; --u-inst:#858484;
 --p1:#174F7B; --p2:#6A9ED4; --p3:#F8BF4C; --p4:#9FA980; --p5:#ED694D; --p6:#858484; --grey-built:#DCDFE0; --park-g:#BEC5A9; --res-open:#FEF5E2;
 --s-own:#9FA980; --s-gp:#174F7B; --s-lp:#6A9ED4; --s-lend:#F8BF4C; --s-bmc:#ED694D; --s-ucf:#858484;
 --ff:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --fm:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
 --r-s:8px; --r-m:12px; --r-l:16px;
 --ease:cubic-bezier(.2,.7,.2,1); --t:.2s;
 --lw:328px; --rw:344px;
 color-scheme:light;
}
  
  
*{box-sizing:border-box}  
[hidden]{display:none!important}  
html,body{height:100%;margin:0}  
body{background:var(--bg);color:var(--fg);font-family:var(--ff);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background-color .3s var(--ease),color .3s var(--ease)}  
.num,.kv b,table td{font-variant-numeric:tabular-nums}  
h1,h2,h3{margin:0;text-wrap:balance}  
button{font:inherit;color:inherit}  
a{color:var(--accent)}  
::selection{background:var(--accent-soft)}  
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}  
  
/* ---------- app shell ---------- */  
.app{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;padding:10px 14px 14px}  
.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;min-height:48px}  
.brand{display:flex;align-items:center;gap:11px;min-width:0}  
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:none;box-shadow:0 4px 14px var(--accent-glow)}  
.logo svg{width:20px;height:20px}  
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.15}  
.brand span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}  
.actions{display:flex;justify-content:flex-end;align-items:center;gap:6px}  
  
/* ---------- buttons: primary / secondary / text + icon ---------- */  
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t) var(--ease),box-shadow var(--t) var(--ease),transform .12s var(--ease)}  
.btn:hover{background:var(--hover);border-color:var(--faint)}  
.btn:active{transform:translateY(1px)}  
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}  
.btn.primary:hover{background:var(--b2);border-color:var(--b2)}  
.btn.ghost{border-color:transparent;background:transparent}  
.btn.ghost:hover{background:var(--hover)}  
.btn.icon{width:34px;padding:0}  
.btn.sm{height:28px;padding:0 9px;font-size:12px}  
.btn.icon.sm{width:28px}  
.btn svg{width:16px;height:16px;flex:none}  
.btn:disabled{opacity:.4;cursor:default;transform:none}  
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}  
:root[data-theme="dark"] .btn[aria-pressed="true"]{color:var(--accent)}  
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer}  
.link:hover{text-decoration:underline}  
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}  
  
/* ---------- segmented control ---------- */  
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--sunk);padding:3px;border-radius:10px;border:1px solid var(--line);position:relative}  
.seg button{border:0;background:transparent;border-radius:7px;height:28px;padding:0 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color var(--t) var(--ease),background var(--t) var(--ease),box-shadow var(--t) var(--ease)}  
.seg button:hover{color:var(--fg)}  
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-1),0 0 0 1px var(--line)}  
:root[data-theme="dark"] .seg button[aria-pressed="true"],:root[data-theme="dark"] .seg button[aria-selected="true"]{background:var(--hover)}  
.seg.full{display:grid;width:100%}  
  
/* ---------- scenario switch ---------- */  
.scen{display:flex;align-items:center;gap:8px}  
.scen .seg{padding:4px;border-radius:12px}  
.scen .seg button{height:34px;padding:0 16px;font-size:13.5px;border-radius:9px}  
.scen .seg button.best{color:var(--accent-strong);box-shadow:inset 0 0 0 1.5px var(--accent);margin-left:4px;display:inline-flex;align-items:center;gap:7px}  
:root[data-theme="dark"] .scen .seg button.best{color:var(--accent)}  
.scen .seg button.best .star{font-size:12px}  
.scen .seg button.best .tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent-strong);padding:2px 6px;border-radius:999px}  
:root[data-theme="dark"] .scen .seg button.best .tag{color:var(--accent)}  
.scen .seg button.best[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px var(--accent-glow)}  
.scen .seg button.best[aria-pressed="true"],:root[data-theme="dark"] .scen .seg button.best[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px var(--accent-glow)}  
.scen .seg button.best[aria-pressed="true"] .tag,:root[data-theme="dark"] .scen .seg button.best[aria-pressed="true"] .tag{background:rgba(255,255,255,.22);color:var(--accent-ink)}  
.more{position:relative}  
  
/* ---------- menus (dropdowns) ---------- */  
.menu{position:absolute;top:calc(100% + 6px);min-width:240px;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-2);padding:6px;z-index:40;opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top;pointer-events:none;transition:opacity .16s var(--ease),transform .16s var(--ease)}  
.menu.open{opacity:1;transform:none;pointer-events:auto}  
.menu.right{right:0} .menu.left{left:0}  
.menu .mh{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:8px 10px 4px}  
.menu button.mi{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:0;background:transparent;border-radius:7px;padding:8px 10px;font-size:13px;cursor:pointer;color:var(--fg)}  
.menu button.mi:hover,.menu button.mi.kb{background:var(--hover)}  
.menu button.mi small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}  
.menu button.mi .ck{width:16px;flex:none;color:var(--accent);font-weight:800}  
.menu button.mi i.sw{width:12px;height:12px;border-radius:3px;flex:none}  
.menu .sep{height:1px;background:var(--line);margin:5px 4px}  
.menu label.mi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px}  
.menu label.mi:hover{background:var(--hover)}  
  
/* custom select (field) */  
.field{display:grid;gap:5px}  
.field>span.fl{font-size:11.5px;font-weight:600;color:var(--muted)}  
.dd{position:relative}  
.dd>button.dv{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:34px;padding:0 10px 0 12px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);font-size:13px;font-weight:500;color:var(--fg);cursor:pointer;text-align:left;transition:border-color var(--t),box-shadow var(--t)}  
.dd>button.dv:hover{border-color:var(--faint)}  
.dd>button.dv[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}  
.dd>button.dv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}  
.dd>button.dv svg{width:14px;height:14px;color:var(--muted);flex:none;transition:transform var(--t)}  
.dd>button.dv[aria-expanded="true"] svg{transform:rotate(180deg)}  
.dd .menu{left:0;right:0;min-width:0;max-height:320px;overflow:auto}  
  
/* ---------- KPI strip ---------- */  
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) auto;gap:10px}  
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 14px 10px;min-width:0;position:relative;overflow:hidden;box-shadow:var(--shadow-1);transition:border-color var(--t),transform var(--t) var(--ease)}  
.kpi:hover{border-color:var(--line-2)}  
.kpi .kl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}  
.kpi .kl svg{width:15px;height:15px;color:var(--accent);flex:none}  
.kpi .kv2{display:flex;align-items:baseline;gap:8px;margin-top:4px;flex-wrap:wrap}  
.kpi .kv2 b{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}  
.kpi .kv2 small{font-size:12px;color:var(--muted)}  
.kpi .dl{margin-top:3px;font-size:11.5px;font-weight:600;display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}  
.kpi .dl.up{color:var(--pass-ink)} .kpi .dl.dn{color:var(--fail-ink)} .kpi .dl.eq{color:var(--faint);font-weight:500}  
.kpi.allm{display:grid;place-items:center;padding:8px 14px;cursor:pointer;color:var(--accent-strong);font-weight:600;font-size:12.5px;text-align:center;gap:4px;background:var(--surface)}  
:root[data-theme="dark"] .kpi.allm{color:var(--accent)}  
.kpi.allm:hover{background:var(--hover)}  
.kpi.allm svg{width:18px;height:18px}  
  
/* ---------- main stage: left panel · map · right panel ---------- */  
.main{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);gap:10px;min-height:0;transition:grid-template-columns .32s var(--ease)}  
.main.lc{--lw:52px} .main.rc{--rw:52px}  
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);min-width:0;min-height:0;display:flex;flex-direction:column;box-shadow:var(--shadow-1);overflow:hidden;position:relative}  
.ph{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--line);min-height:54px}  
.ph h2{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}  
.ph .tools{display:flex;gap:2px}  
.pb{overflow:auto;min-height:0;flex:1;padding:12px 14px 16px;scrollbar-width:thin}  
.rail{display:none;flex-direction:column;align-items:center;gap:6px;padding:10px 0}  
.rail .btn{width:36px}  
.rail .vt{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:600;color:var(--muted);margin-top:6px;letter-spacing:.02em}  
.main.lc .left .ph,.main.lc .left .pbody{display:none}  
.main.lc .left .rail{display:flex}  
.main.rc .right .ph,.main.rc .right .pbody{display:none}  
.main.rc .right .rail{display:flex}  
.pbody{display:flex;flex-direction:column;min-height:0;flex:1}  
.main.maponly{--lw:0px;--rw:0px;gap:0}  
.main.maponly .panel{display:none}  
  
/* ---------- map stage ---------- */  
.main>.left{grid-column:1} .main>.view{grid-column:2} .main>.right{grid-column:3}  
.view{position:relative;background:var(--ground);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;min-height:0;box-shadow:var(--shadow-1);transition:background-color .3s var(--ease)}  
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}  
canvas.drag{cursor:grabbing} canvas.pt{cursor:pointer}  
.mtools{position:absolute;top:12px;left:12px;right:96px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}  
.mtools>*{pointer-events:auto}  
.glass{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2)}  
.mtools .grp{display:flex;align-items:center;gap:4px;padding:4px}  
.mtools .grp .seg{background:transparent;border:0;padding:0}  
.mtools .cb{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px}  
.mtools .cb>span{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}  
.mtools .cb .dd{min-width:230px}  
.mtools .cb .dd>button.dv{border-color:transparent;background:var(--sunk);height:30px;font-weight:600}  
.ctxline{position:absolute;left:12px;top:64px;max-width:min(560px,calc(100% - 120px));padding:7px 8px 7px 12px;font-size:12.5px;display:flex;align-items:center;gap:10px;transition:opacity .25s var(--ease),transform .25s var(--ease)}  
.ctxline b{color:var(--accent-strong);white-space:nowrap} :root[data-theme="dark"] .ctxline b{color:var(--accent)}  
.ctxline span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}  
.ctxline .chipx{margin-left:auto}  
.nav{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 6px}  
.nav canvas{width:56px;height:150px;cursor:default}  
.nav .btn{width:30px;height:30px}  
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;padding:4px;gap:2px}  
.zoom .btn{width:30px;height:30px;border:0}  
.legend{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 380px);padding:10px 12px;font-size:12px;display:grid;gap:7px;transition:opacity .2s}  
.legend .lh{display:flex;align-items:center;gap:10px}  
.legend .ttl{font-weight:700;font-size:12px}  
.legend .lh .btn{margin-left:auto}  
.legend .bar{height:8px;border-radius:5px;width:240px;max-width:100%}  
.legend .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;gap:10px;width:240px;max-width:100%}  
.legend .cats{display:flex;flex-wrap:wrap;gap:5px 12px;max-width:640px}  
.legend .cats span{white-space:nowrap}  
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}  
.legend .site{border-top:1px solid var(--line);padding-top:7px;color:var(--muted)}  
.legend.min .cats,.legend.min .bar,.legend.min .ends{display:none}  
.status{position:absolute;right:58px;bottom:12px;padding:6px 12px;font-size:12px;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:center}  
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}  
.status.busy .dot{animation:pulse 1s infinite}  
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}  
.toast{position:absolute;top:110px;left:50%;transform:translate(-50%,-6px);padding:8px 14px;font-size:12.5px;opacity:0;transition:opacity .3s var(--ease),transform .3s var(--ease);pointer-events:none;white-space:nowrap;max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis}  
.toast.show{opacity:1;transform:translate(-50%,0)}  
.toast b{color:var(--accent-strong)} :root[data-theme="dark"] .toast b{color:var(--accent)}  
.hovercard{position:absolute;pointer-events:none;padding:9px 12px;font-size:12px;min-width:180px;transform:translate(14px,14px);transition:opacity .12s;z-index:4}  
.hovercard b{display:block;font-size:13px;margin-bottom:2px}  
.hovercard span{color:var(--muted)}  
  
/* plot card */  
.pcard{position:absolute;top:12px;right:84px;width:340px;max-height:calc(100% - 24px);display:flex;flex-direction:column;overflow:hidden;z-index:5;transform:translateX(16px);opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease)}  
.pcard.open{opacity:1;transform:none;pointer-events:auto}  
.pcard .pch{display:flex;align-items:flex-start;gap:10px;padding:14px 12px 10px 16px}  
.pcard .pch h3{font-size:17px;font-weight:700;letter-spacing:-.01em}  
.pcard .pch p{margin:2px 0 0;font-size:12px;color:var(--muted)}  
.pcard .pch .btn{margin-left:auto;flex:none}  
.pcard .seg{margin:0 14px 10px}  
.pcard .pcb{overflow:auto;padding:0 16px 14px;min-height:0}  
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}  
.badge.pass{background:var(--pass-soft);color:var(--pass-ink)} .badge.warn{background:var(--warn-soft);color:var(--warn-ink)} .badge.fail{background:var(--fail-soft);color:var(--fail-ink)} .badge.acc{background:var(--accent-soft);color:var(--accent-strong)}  
:root[data-theme="dark"] .badge.acc{color:var(--accent)}  
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:4px 0 0}  
.facts dt{font-size:11.5px;color:var(--muted)}  
.facts dd{margin:1px 0 0;font-weight:700;font-size:15px}  
.facts dd small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}  
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:2px 0 12px}  
.mini div{background:var(--sunk);border-radius:10px;padding:9px 11px}  
.mini b{display:block;font-size:17px;font-weight:700}  
.mini span{font-size:11.5px;color:var(--muted)}

.tipx{position:fixed;z-index:90;pointer-events:none;background:var(--inv);color:var(--inv-fg);font-size:12px;line-height:1.4;padding:6px 9px;border-radius:7px;max-width:280px;box-shadow:var(--shadow-2);opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s}  
.tipx.show{opacity:1;transform:none}  
.tipx kbd{font:600 10.5px var(--ff);background:rgba(164,163,163,.25);border-radius:4px;padding:1px 5px;margin-left:6px}  
.present .kpis,.present .main>.panel{display:none}  
.present .main{--lw:0px;--rw:0px;gap:0}  
.present .app{grid-template-rows:auto minmax(0,1fr)}  
.pres{position:absolute;left:12px;right:12px;bottom:12px;display:none;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;z-index:3}  
.present .pres{display:grid}  
.present .legend,.present .zoom,.present .status{display:none}  
.pres div{padding:14px 18px}  
.pres b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em}  
.pres span{font-size:13px;color:var(--muted)}  
.pres em{display:block;font-style:normal;font-size:12.5px;font-weight:600;color:var(--pass-ink)}  
@media (max-width:1280px){:root{--lw:300px;--rw:310px}.kpi .kv2 b{font-size:21px}}  
@media (max-width:1100px){.main{grid-template-columns:var(--lw) minmax(0,1fr) 0px}.right{display:none}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}  
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}  
.dlg:focus{outline:none}  
.captured{margin-top:8px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px}  
.captured b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em}  
.captured span{font-size:12px;color:var(--muted);line-height:1.4}  
.six th.hl,.six td.hl{background:var(--accent-soft,rgba(23,79,123,.06));font-weight:600}.six small{font-size:11px;color:var(--muted)}

/* ======================= GEOMETRY HELPERS ======================= */  
function segD(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy; let t=L? ((px-ax)*dx+(py-ay)*dy)/L : 0; t=t<0?0:t>1?1:t; const qx=ax+t*dx-px, qy=ay+t*dy-py; return Math.sqrt(qx*qx+qy*qy); }  
function inRing(x,y,r){ let c=false; for(let i=0,j=r.length-1;i<r.length;j=i++){ const a=r[i], b=r[j]; if(((a[1]>y)!==(b[1]>y)) && x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) c=!c; } return c; }  
function slen(s){ return Math.hypot(s.b[0]-s.a[0], s.b[1]-s.a[1]); }

function irrOf(cf){ const npv=r=>cf.reduce((s,c,t)=>s+c/Math.pow(1+r,t),0);

 for(let i=0;i<70;i++){ const m=(lo+hi)/2, fm=npv(m); if(flo*fm<=0){hi=m;fhi=fm;} else {lo=m;flo=fm;} } return (lo+hi)/2; }  
const annual = q => q===null ? null : Math.pow(1+q,4)-1;  
function ownerModel(r){  
 const U=r.U, own=U.members.map(p=>p.ownType), lu=U.members.map(p=>p.lu);  
 const occ = U.members.filter(p=>(p.lu==="Residential"||p.lu==="Institutional") && p.own!=="Public").reduce((a,p)=>a+p.area,0);  
 const instA = U.members.filter(p=>p.lu==="Institutional" && p.own!=="Public").reduce((a,p)=>a+p.area,0);  
 // a public institution (BMC) gets its facility rebuilt free in place of a land lease; other public land is leased at RR  
 const instPub = U.members.filter(p=>p.lu==="Institutional" && p.own==="Public").reduce((a,p)=>a+p.area,0);  
 const pub = U.members.filter(p=>p.own==="Public").reduce((a,p)=>a+p.area,0) - instPub;  
 const vacant = Math.max(0, r.area - occ - pub - instPub);  
 const svy = FIN.e0src===1 && D.exSurvey ? U.members.filter(p=>p.lu==="Residential" && p.own!=="Public").reduce((a,p)=>a+((D.exSurvey[p.id]||[0])[0]),0) : null;  
 const resBUA = svy!==null ? svy : (occ-instA)*FIN.e0;  
 const exBUA = resBUA + (instA+instPub)*FIN.e0i;  
 const exCarpet = exBUA*FIN.exCarpet, resCarpet=resBUA*FIN.exCarpet;  
 return {occ, instA, instPub, pub, vacant, exBUA, exCarpet, members: Math.round(resCarpet/FIN.flat), rehabCarpet: exCarpet*(1+FIN.extra/100), privCarpet: exCarpet - instPub*FIN.e0i*FIN.exCarpet};

/* ---------- timing and areas of one development unit (quarters from the unit's own start) ---------- */  
function timing(r){

// what is rebuilt for members, what is sold, leased or let (FSI m²)  
function areas(r){

 const rehabRes0 = r.inst ? Math.min(r.instA||0, needFSI) : Math.min(r.resid||0, needFSI);  
 const rehabOff = (r.edge==="jv" && !r.inst) ? Math.min(r.office||0, needFSI-rehabRes0) : 0; // members can take podium floors on JVLR  
 const rehabRes = rehabRes0 + rehabOff, shortFSI = Math.max(0, needFSI - rehabRes);  
 const saleRes0 = r.inst ? Math.max(0,(r.instA||0) - rehabRes0) : Math.max(0,(r.resid||0) - rehabRes0);  
 const rentHomes = saleRes0*(r.rentShare||0), gbHomes = r.inst ? 0 : (saleRes0-rentHomes)*(r.gbRent||0), saleRes = saleRes0 - rentHomes - gbHomes;  
 const off = Math.max(0,(r.office||0) - rehabOff), lease = FIN.offMode===1;

const pIdx = t => Math.pow(1+(FIN.priceGrow||0)/100, Math.max(0,t)/4);  
const cIdx = t => Math.pow(1+(FIN.costGrow||0)/100, Math.max(0,t)/4);  
  
/* ---------- the plot's own cash flow: what it sells, builds and pays (unlevered, before the phase company's loan) ---------- */

function dcf(r,S,bank,ctx){

 // ---- owners under the joint development agreement* ----  
 const corpus = build ? om.privCarpet*sqft*FIN.corpus : 0;  
 const rentQ = build ? om.privCarpet*sqft*FIN.rent*3 : 0;  
 const landBuy = build ? om.vacant*rr*FIN.land : 0;  
 const landBMC = build ? om.pub*rr*FIN.land : 0;  
 // ---- what it is worth ----  
 const avgUp = Math.max(0,(floors-9))/2, floorPrem = 1 + FIN.rise/100*avgUp, pf = mixOf(S,U).pf;  
 const resRate = (r.edge==="jv"?FIN.rateResJ:FIN.rateRes)*floorPrem*pf;  
 const revRes = ar.saleRes*cpt*sqft*resRate*mk, revRet = ar.retail*cpt*sqft*FIN.rateRet*mk, revOffSale = ar.lease? 0 : ar.off*cpt*sqft*FIN.rateOff*mk;  
 const saleBase = revRes+revRet+revOffSale, uplift = saleBase*up, saleVal = saleBase+uplift;  
 // offices leased, then sold at stabilisation to an investor at the exit yield*

 const stampBase = z(); // sale value collected, for the stamp-duty credit  
 if(r.retro){ const c=om.exBUA*FIN.retro; for(let k=0;k<4;k++) ownCF.retro[apprQ+k]-=c/4; }

 }  
 if(r.tdrOut>0){ const s=tdrSold*tdrPrice*0.95/12, f=tdrFloor*tdrPrice*0.7*0.95/4; for(let k=0;k<12;k++) ownCF.tdr[Math.min(N-1,apprQ+4+k)]+=s; for(let k=0;k<4;k++) ownCF.tdr[Math.min(N-1,apprQ+20+k)]+=f; }

 const dq=Math.pow(1+FIN.disc/100,0.25)-1; const npv=fcf.reduce((s,c,t)=>s+c/Math.pow(1+dq,t),0);

function ramp(t){ const cs=["--h0","--h1","--h2","--h3","--h4"].map(css); const x=Math.max(0,Math.min(1,t))*4, i=Math.min(3,Math.floor(x)); return mixc(cs[i],cs[i+1],x-i); }  
function hex(c){ c=c.trim(); if(c.startsWith("rgb")){ return c.match(/[\d.]+/g).slice(0,3).map(Number); } c=c.replace("#",""); if(c.length===3) c=c.split("").map(x=>x+x).join(""); return [0,2,4].map(i=>parseInt(c.substr(i,2),16)); }  
function mixc(a,b,t){ const A=hex(a),B=hex(b); return "rgb("+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")+")"; }  
function rgba(c,a){ const h=hex(c); return `rgba(${h[0]},${h[1]},${h[2]},${a})`; }  
function divc(t){ const n=css("--ground"); return t<0 ? mixc(n,css("--exp"),Math.min(1,-t*1.3+0.12)) : mixc(n,css("--imp"),Math.min(1,t*1.3+0.12)); }  
function seqc(t){ return mixc(css("--ground"),css("--accent"),0.15+0.85*t); }  
function shade(col,k){ const h=hex(col); return `rgb(${h.map(v=>Math.max(0,Math.min(255,Math.round(v*k)))).join(",")})`; }  
function zoneCol(r){ return r.retro? css("--retro") : r.reserve? css("--open") : r.row1? css("--row1") : css(CODE[r.edge].col); }  
function unitColor(r){  
 if(MET==="zone"||MET==="use") return zoneCol(r);  
 if(MET==="phase") return r.phase? PHC(r.phase) : (r.reserve? css("--open") : css("--ctx-bld"));  
 if(MET==="tests"){ if(r.reserve) return css("--open"); return css(r.fails?"--fail":r.warns?"--warn":"--pass"); }  
 if(r.reserve) return css("--open");  
 const m=METRICS.find(x=>x.k===MET), v=m.v(r); if(v===null||v===undefined||isNaN(v)) return css("--ctx");  
 return m.div? divc(v) : m.seq? seqc(v) : ramp(v);  
}

 [...rows.keys()].sort((a,b)=>a-b).forEach(j=>{ const list=rows.get(j).sort((a,b)=>a[0]-b[0]); const runs=[]; let cur=null;

// soft ambient shadows: every building's footprint swept away from the light, filled once so overlaps never darken  
function groundShadows(focusR){

 cw(ring); cw(sh); for(let i=0;i<n;i++){ const a=ring[i], b=ring[(i+1)%n]; cw([a,b,[b[0]+dx,b[1]+dy],[a[0]+dx,a[1]+dy]]); } any=true; };  
 OUT.res.forEach(r=>{ if(!r.geo||phState(r)==="later") return; if(focusR && r!==focusR) return; const cg=chgOf(r), g0=cg?cg.grow:1;

let TW=null;  
function tweenView(to, ms){ const from=Object.assign({},view), t0=performance.now(); ms=ms||550; cancelAnimationFrame(TW&&TW.raf); TW={};

 const step=now=>{ const k=ease(Math.min(1,(now-t0)/ms)); for(const key in to) view[key]=from[key]+(to[key]-from[key])*k; draw(); if(k<1) TW.raf=requestAnimationFrame(step); else TW=null; }; TW.raf=requestAnimationFrame(step); }  
function stopTween(){ if(TW){ cancelAnimationFrame(TW.raf); TW=null; } }  
function fitTarget(rs, pad){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9, hm=0; rs.forEach(r=>{ hm=Math.max(hm,r.Htop||0); r.U.members.forEach(p=>p.rings[0].forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);})); });  
 if(x0>x1) return null; const sp=Math.max(x1-x0,y1-y0,hm*1.3)*(pad||1.15); return {cx:(x0+x1)/2, cy:(y0+y1)/2, s:Math.min(W,H-120)/sp}; }  
function fitAll(){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;  
 const pts = MODE==="axo" ? PLOTS.filter(p=>p.role==="dev"||p.role==="inst"||p.role==="reserve").flatMap(p=>p.rings[0]) : BND;  
 pts.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);});  
 return {cx:(x0+x1)/2, cy:(y0+y1)/2+(MODE==="axo"?18:0), s:Math.min(W*0.92,H-110)/(Math.max(x1-x0,y1-y0)*(MODE==="plan"?1.06:1.12))}; }

 else if(k==="p"||k==="P") presenter(); else if(k==="+"||k==="=") $("zIn").click(); else if(k==="-"||k==="_") $("zOut").click(); });  
}  
  
  
/* ======================= run ======================= */  
function run(fast){  
 S._fast=!!fast;  
 OUT=runAll(S); P2U=new Map(); OUT.res.forEach(r=>r.U.members.forEach(p=>P2U.set(p.id,r)));  
 OUT.res.forEach(r=>{ r.ground=r.retro?[]:groundRects(r); r.geo=bldGeo(r); r.rgeo=resGeo(r); });  
 AGG=aggregate();  
 if(PH_SEL!==null && PH_SEL>OUT.phases.length){ PH_SEL=null; PH_FOCUS=null; }  
 if(SEL!==null && !PBY.get(SEL)) SEL=null;  
 let n=markChanges(); if(fast) _fastN=n; else { n=Math.max(n,_fastN); _fastN=0; }  
 if(LASTLEV && performance.now()-LASTLEV.t<5000 && !fast){ const m=METRICS.find(x=>x.k===MET); showToast(`<b>${esc(LASTLEV.label.replace(/\*$/,""))}</b> · ${n? `${n} plot${n>1?"s":""} changed` : "no plot changed"} · showing ${esc(m?(METRIC_LBL[m.k]||m.l):"")}`); }  
 if(PRESET!=="custom" && !fast && !SCACHE.has(PRESET) && PRESET!=="__now") SCACHE.set(PRESET, metricsOf(AGG,OUT));  
 if(!fast) scheduleStress();  
 kpiUI(); rightUI(); legendUI(); scenUI(); ctxUI(); histUI(); if(SEL!==null) cardUI(); if(SHEET.open) sheetBody(); draw();  
 setStatus(false, `${OUT.res.filter(r=>!r.reserve).length} development units · ${OUT.phases.length} phases · ${A_txt()}`);  
}  
function A_txt(){ return AGG.byRight===AGG.nUnits? "every unit by right" : `${AGG.nUnits-AGG.byRight} need a variance`; }  
let _full=null, _fastN=0;  
function runFull(){ if(_full) clearTimeout(_full); setStatus(true,"Recalculating every plot…"); run(true); _full=setTimeout(()=>{ _full=null; run(false); },30); }  
let _t=null; function schedule(){ if(_t) return; _t=requestAnimationFrame(()=>{ _t=null; run(true); }); }  
  
/* ---------- start ---------- */  
applyTheme(THEME,false);  
MET="use"; PRESET="code"; S=clone(PRESETS.code.s);  
wire(); layoutUI(); metricUI(); leverUI(); setLTab("form"); histUI();  
requestAnimationFrame(()=>{ const b=cv.getBoundingClientRect(); DPR=Math.min(2,window.devicePixelRatio||1); W=b.width; H=b.height; cv.width=W*DPR; cv.height=H*DPR;  
 setStatus(true,"Building every plot…"); run(false); fit(true); ensureBase();  
 if(!store.get("toured",false)) setTimeout(()=>tour(0),900); });  
  
</script>  
</body>
